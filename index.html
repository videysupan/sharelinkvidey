<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Share Link Videy</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #111;

    color: #fff;

    font-family: Arial, sans-serif;

}


.container {

    width: 100%;

    max-width: 900px;

    margin: auto;

    padding: 15px;

}


.title {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin: 10px 0 15px;

}


/* PLAYER */

.video-wrapper {

    position: relative;

    width: 100%;

    background: #000;

    border-radius: 10px;

    overflow: hidden;

}


video {

    display: block;

    width: 100%;

    height: auto;

    max-height: 80vh;

    background: #000;

}


/* PLAY BUTTON */

.play-button {

    position: absolute;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    width: 75px;

    height: 75px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

    color: #111;

    font-size: 30px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    padding-left: 5px;

    box-shadow: 0 4px 20px rgba(0,0,0,.4);

    z-index: 5;

}


.play-button:hover {

    transform:
        translate(-50%, -50%)
        scale(1.08);

}


.play-button.hidden {

    display: none;

}


/* BUTTON */

.button-box {

    margin-top: 15px;

}


.next-button {

    width: 100%;

    border: none;

    border-radius: 8px;

    padding: 15px;

    background: #fff;

    color: #111;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.next-button:hover {

    background: #ddd;

}


.next-button:active {

    transform: scale(.98);

}

</style>

</head>


<body>


<div class="container">


    <div class="title">

        Video Pilihan

    </div>


    <div class="video-wrapper">


        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata">
        </video>


        <button
            id="playButton"
            class="play-button">

            ▶

        </button>


    </div>


    <div class="button-box">

        <button
            id="nextButton"
            class="next-button">

            ▶ Video Lainnya

        </button>

    </div>


</div>



<script>


/*
 * GANTI DENGAN URL WORKER ANDA
 */

const API_URL =
    "https://video.ignasiusevan-id.workers.dev/random";


const videoPlayer =
    document.getElementById("videoPlayer");


const playButton =
    document.getElementById("playButton");


const nextButton =
    document.getElementById("nextButton");



/*
 * AMBIL VIDEO ACAK
 */

async function loadRandomVideo() {


    try {


        nextButton.disabled = true;


        const response =
            await fetch(API_URL, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "Gagal mengambil video"
            );

        }


        const data =
            await response.json();


        if (!data.video) {

            throw new Error(
                "URL video tidak ditemukan"
            );

        }


        /*
         * Pasang video
         */

        videoPlayer.src = data.video;

        videoPlayer.load();


        /*
         * Tampilkan tombol play
         */

        playButton.classList.remove("hidden");


    }

    catch (error) {


        console.error(error);

        alert(
            "Video gagal dimuat."
        );


    }

    finally {


        nextButton.disabled = false;


    }

}



/*
 * PLAY BUTTON
 */

playButton.addEventListener(
    "click",
    function() {

        videoPlayer.play();

    }
);



/*
 * VIDEO MULAI
 */

videoPlayer.addEventListener(
    "play",
    function() {

        playButton.classList.add(
            "hidden"
        );

    }
);



/*
 * VIDEO PAUSE
 */

videoPlayer.addEventListener(
    "pause",
    function() {

        if (!videoPlayer.ended) {

            playButton.classList.remove(
                "hidden"
            );

        }

    }
);



/*
 * VIDEO SELESAI
 */

videoPlayer.addEventListener(
    "ended",
    function() {

        playButton.classList.remove(
            "hidden"
        );

    }
);



/*
 * VIDEO LAINNYA
 */

nextButton.addEventListener(
    "click",
    function() {

        loadRandomVideo();

    }
);



/*
 * VIDEO PERTAMA
 */

loadRandomVideo();


</script>


</body>

</html>
